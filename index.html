<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Where Winds Meet – Play Free on PC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #07090c;
      --gold: #e2bd6a;
      --gold-deep: #a9782c;
      --red: #c8352c;
      --jade: #5fc9b0;
      --paper: #f3ead7;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--ink) url("keyart.jpg") center / cover no-repeat;
      color: #fff;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(1.05) saturate(1.1);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(7, 9, 12, 0.05), rgba(7, 9, 12, 0.5) 50%, rgba(7, 9, 12, 0.82)),
        radial-gradient(circle at 20% 22%, rgba(226, 189, 106, 0.28), transparent 30%),
        radial-gradient(circle at 85% 78%, rgba(200, 53, 44, 0.3), transparent 32%);
      pointer-events: none;
    }

    .stage {
      position: relative;
      z-index: 2;
      width: min(100vw, calc(100svh * 16 / 9));
      height: min(100svh, calc(100vw * 9 / 16));
      aspect-ratio: 16 / 9;
      container-type: size;
      --u: min(1cqw, 1.777cqh);
      padding: calc(var(--u) * 1.8) calc(var(--u) * 3) calc(var(--u) * 2.3);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      min-height: calc(var(--u) * 4.1);
    }

    .logo {
      width: calc(var(--u) * 15);
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.7));
    }

    main {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      align-items: center;
      gap: calc(var(--u) * 3);
    }

    .portrait {
      position: relative;
      margin: 0;
      justify-self: center;
      width: calc(var(--u) * 34);
      aspect-ratio: 7 / 8;
      border-radius: calc(var(--u) * 0.6);
      overflow: hidden;
      border: calc(var(--u) * 0.18) solid var(--gold);
      box-shadow:
        calc(var(--u) * 0.75) calc(var(--u) * 0.75) 0 var(--red),
        calc(var(--u) * -0.55) calc(var(--u) * -0.55) 0 rgba(226, 189, 106, 0.35),
        0 calc(var(--u) * 2) calc(var(--u) * 4) rgba(0, 0, 0, 0.6);
    }

    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .copy {
      justify-self: end;
      max-width: calc(var(--u) * 42);
    }

    .pill {
      display: inline-flex;
      margin-bottom: calc(var(--u) * 1.25);
      padding: calc(var(--u) * 0.58) calc(var(--u) * 0.9);
      color: var(--ink);
      background: var(--paper);
      border: calc(var(--u) * 0.13) solid var(--ink);
      box-shadow: calc(var(--u) * 0.36) calc(var(--u) * 0.36) 0 var(--red);
      font-size: calc(var(--u) * 0.85);
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transform: rotate(-2deg);
    }

    h1 {
      margin: 0;
      font-family: Cinzel, "Trajan Pro", Georgia, serif;
      font-size: calc(var(--u) * 4.7);
      line-height: 0.98;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: calc(var(--u) * 0.2) calc(var(--u) * 0.2) 0 var(--ink);
    }

    h1 span {
      display: block;
      color: var(--gold);
      text-shadow:
        calc(var(--u) * 0.2) calc(var(--u) * 0.2) 0 var(--ink),
        calc(var(--u) * 0.34) calc(var(--u) * 0.34) 0 var(--red);
    }

    .subtext {
      max-width: calc(var(--u) * 34);
      margin: calc(var(--u) * 1.25) 0 calc(var(--u) * 1.6);
      color: rgba(255, 255, 255, 0.85);
      font-size: calc(var(--u) * 1.12);
      line-height: 1.48;
      font-weight: 600;
    }

    .cta-area {
      display: grid;
      justify-items: start;
      gap: calc(var(--u) * 0.72);
    }

    .cta {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: calc(var(--u) * 27.4);
      min-height: calc(var(--u) * 5.35);
      color: #fffaf0;
      background:
        linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.35) 30%, transparent 40%) -150% 0 / 250% 100% no-repeat,
        linear-gradient(160deg, #c9a15a, #a67a36 40%, #8a6127 70%, #b58b45);
      clip-path: polygon(0 4%, 97% 0, 100% 45%, 98.5% 100%, 2% 96%, 0.6% 55%);
      text-decoration: none;
      font-family: Cinzel, "Trajan Pro", Georgia, serif;
      font-size: calc(var(--u) * 2.3);
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-shadow: 0 2px 3px rgba(60, 36, 8, 0.7);
      filter: drop-shadow(0 calc(var(--u) * 0.9) calc(var(--u) * 1.4) rgba(0, 0, 0, 0.55));
      animation: pulse 1.65s ease-in-out infinite, shine 2.6s ease-in-out infinite;
    }

    .cta-wrap {
      position: relative;
      display: inline-block;
    }

    .cta:hover { filter: drop-shadow(0 calc(var(--u) * 0.9) calc(var(--u) * 1.4) rgba(0, 0, 0, 0.55)) brightness(1.1); }

    .awards {
      display: block;
      width: calc(var(--u) * 38);
      max-width: 100%;
      margin: 0 0 calc(var(--u) * 2.2);
      opacity: 0.9;
    }

    .cta-badge {
      position: absolute;
      right: calc(var(--u) * -5.4);
      bottom: calc(var(--u) * -0.75);
      color: #fff;
      font-size: calc(var(--u) * 1.28);
      font-weight: 900;
      white-space: nowrap;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink);
      transform: rotate(-4deg);
    }

    .cta-badge strong { color: var(--jade); }

    .windows-only {
      margin-left: calc(var(--u) * 1.1);
      color: rgba(255, 255, 255, 0.72);
      font-size: calc(var(--u) * 0.78);
      font-weight: 800;
      text-transform: uppercase;
    }

    @keyframes shine {
      0%, 55% { background-position: -150% 0, 0 0; }
      100% { background-position: 250% 0, 0 0; }
    }

    @keyframes pulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(calc(var(--u) * -0.22)) scale(1.025); }
    }

    /* Portrait screens: stack everything, still no scroll */
    @media (orientation: portrait) {
      .stage {
        width: 100vw;
        height: 100svh;
        aspect-ratio: auto;
        --u: min(2.3cqw, 1.3cqh);
        padding: calc(var(--u) * 2) calc(var(--u) * 2.4);
        grid-template-rows: auto 1fr;
      }
      header { justify-content: center; }
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        align-content: center;
        justify-items: center;
        gap: calc(var(--u) * 2.4);
        text-align: center;
      }
      .portrait { width: min(calc(var(--u) * 24), 60vw); }
      .awards { margin-inline: auto; }
      .copy { justify-self: center; max-width: 100%; }
      h1 { font-size: calc(var(--u) * 3.7); }
      .subtext { margin-inline: auto; max-width: 100%; font-size: calc(var(--u) * 1.3); }
      .awards { width: 100%; }
      .cta { min-width: calc(var(--u) * 26); }
      .cta-area { justify-items: center; }
      .windows-only { margin-left: 0; }
      .cta-badge { position: static; display: block; margin-top: calc(var(--u) * 1.4); transform: none; }
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline preload="auto" poster="keyart.jpg" aria-hidden="true">
    <source src="bg.mp4" type="video/mp4">
  </video>

  <div class="stage">
    <header>
      <img class="logo" src="logo.png" alt="Where Winds Meet">
    </header>

    <main>
      <figure class="portrait">
        <img src="hero.jpg" alt="Where Winds Meet swordsman">
      </figure>

      <section class="copy">
        <div class="pill">Free-to-play · Open world Wuxia</div>
        <h1>Master the Blade. <span>Ride the Wind.</span></h1>
        <p class="subtext">Walk on water, duel legendary swordsmen and carve your own legend across a vast open world of ancient China.</p>
        <img class="awards" src="awards.png" alt="Best New Game, Innovation Excellence Game Award, Best PC &amp; Console Game of the Year, Gamescom Award">
        <div class="cta-area">
          <div class="cta-wrap">
            <a class="cta" id="cta" href="https://trk.pangamer.com/5J8H/2J1J9/">Play Free Now</a>
            <span class="cta-badge">100% <strong>Free</strong> on PC</span>
          </div>
          <div class="windows-only">Windows PC only</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Forward the lander's query string (Propeller macros: sub1=${SUBID}&sub2=${ZONEID}...) to the offer link.
    const cta = document.getElementById("cta");
    if (window.location.search) {
      cta.href = cta.href + window.location.search;
    }
  </script>
</body>
</html>
